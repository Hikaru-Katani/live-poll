<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #2438E8;
    --ink: #0E1A6B;
    --sun: #FFD23F;
    --paper: #F6F7FB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-optical-sizing: auto;
    -webkit-tap-highlight-color: transparent;
  }

  .voter {
    min-height: 100svh;
    max-width: 560px;
    margin: 0 auto;
    display: flex; flex-direction: column;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
  }

  .status { margin: 0 0 0.75rem; font-size: 1rem; font-weight: 600; opacity: 0.7; }
  .question {
    margin: 0 0 1.5rem;
    font-size: clamp(1.75rem, 7vw, 2.5rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .question.placeholder { font-weight: 600; opacity: 0.6; }

  .choices {
    flex: 1;
    min-height: 320px;
    display: grid; grid-template-rows: 1fr 1fr; gap: 1rem;
  }
  .choices[hidden] { display: none; }

  .choice {
    position: relative;
    border: 0; border-radius: 24px;
    font: inherit; font-size: clamp(2.5rem, 12vw, 4rem); font-weight: 800;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  .choice:active:not(:disabled) { transform: scale(0.98); }
  .choice:disabled { cursor: default; }
  .yes { background: var(--sun); color: var(--ink); }
  .no { background: var(--cobalt); color: var(--paper); }

  .choice[aria-pressed="true"] { box-shadow: 0 0 0 5px var(--paper), 0 0 0 10px var(--ink); }
  .choice[aria-pressed="true"]::after {
    content: "✓";
    position: absolute; top: 0.6rem; right: 1rem;
    font-size: 1.75rem;
  }
  .voted .choice[aria-pressed="false"] { opacity: 0.4; }
  .closed .choice[aria-pressed="false"] { opacity: 0.3; }

  .choice:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

  .note { min-height: 1.5em; margin: 1.25rem 0 0; text-align: center; font-size: 1.1rem; }

  @media (prefers-reduced-motion: reduce) {
    .choice { transition: none; }
  }
</style>
</head>
<body>
<main class="voter" id="voter">
  <p class="status" id="status">Connecting…</p>
  <h1 class="question placeholder" id="question">Joining the poll…</h1>
  <div class="choices" id="choices" hidden>
    <button class="choice yes" id="yesBtn" aria-pressed="false" disabled>Yes</button>
    <button class="choice no" id="noBtn" aria-pressed="false" disabled>No</button>
  </div>
  <p class="note" id="note"></p>
</main>

<script type="module">
  import { db, signIn, isConfigured, ref, onValue, set } from "./firebase.js";

  const $ = (id) => document.getElementById(id);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  let uid = null;
  let session = null;
  let myVote = null;
  let stopMine = null;

  if (!isConfigured) {
    $("status").textContent = "Not set up yet";
    $("question").textContent = "This poll isn't connected to a database yet. Ask the host to finish setup.";
  } else {
    start();
  }

  async function start() {
    try {
      uid = (await signIn()).uid;
    } catch (e) {
      $("status").textContent = "Can't connect";
      $("question").textContent = "Couldn't join the poll. Reload the page to try again.";
      return;
    }
    $("status").textContent = "You're in";
    onValue(ref(db, "session"), (snap) => {
      const prevId = session?.questionId;
      session = snap.val();
      if (session?.questionId !== prevId) watchMyVote(session?.questionId);
      render();
    });
  }

  function watchMyVote(questionId) {
    if (stopMine) stopMine();
    stopMine = null;
    myVote = null;
    if (!questionId) return;
    stopMine = onValue(ref(db, "votes/" + questionId + "/" + uid), (snap) => {
      myVote = snap.val();
      render();
    });
  }

  function render() {
    const voter = $("voter");
    const q = $("question");
    if (!session) {
      q.textContent = "Waiting for the first question…";
      q.classList.add("placeholder");
      $("choices").hidden = true;
      $("note").textContent = "Keep this page open. The question will appear here.";
      return;
    }
    q.textContent = session.text;
    q.classList.remove("placeholder");
    $("choices").hidden = false;
    $("status").textContent = session.open ? "Voting open" : "Voting closed";

    for (const [btn, value] of [[$("yesBtn"), "yes"], [$("noBtn"), "no"]]) {
      btn.disabled = !session.open;
      btn.setAttribute("aria-pressed", String(myVote === value));
    }
    voter.classList.toggle("voted", !!myVote && session.open);
    voter.classList.toggle("closed", !session.open);

    if (!session.open) {
      $("note").textContent = myVote ? "Voting is closed. You voted " + cap(myVote) + "." : "Voting is closed.";
    } else {
      $("note").textContent = myVote ? "You voted " + cap(myVote) + ". Tap the other answer to change it." : "Tap your answer.";
    }
  }

  async function vote(value) {
    if (!session?.open || myVote === value) return;
    const previous = myVote;
    myVote = value;
    render();
    navigator.vibrate?.(20);
    try {
      await set(ref(db, "votes/" + session.questionId + "/" + uid), value);
    } catch (e) {
      myVote = previous;
      render();
      $("note").textContent = "Your vote didn't go through. Check your connection and tap again.";
    }
  }

  $("yesBtn").addEventListener("click", () => vote("yes"));
  $("noBtn").addEventListener("click", () => vote("no"));
</script>
</body>
</html>
