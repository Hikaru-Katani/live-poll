<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live poll – main display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --cobalt: #2438E8;
    --ink: #0E1A6B;
    --sun: #FFD23F;
    --paper: #F6F7FB;
    --mist: rgba(246, 247, 251, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    background: var(--cobalt);
    color: var(--paper);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-optical-sizing: auto;
  }

  /* The stage takes whatever height is left above the control panel,
     and everything inside sizes itself to that space (cqh/cqw units),
     so nothing slides underneath the panel. */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    container-type: size;
    overflow: hidden;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4vw;
    padding: 6vh 5vw;
    align-items: stretch;
  }

  /* Question at the top, result centered in the space below it */
  #poll { display: flex; flex-direction: column; min-height: 0; }

  .status {
    display: inline-flex; align-items: center; gap: 0.6em;
    margin: 0 0 1.5rem;
    font-size: 1.25rem; font-weight: 600;
  }
  .status::before {
    content: ""; width: 0.7em; height: 0.7em; border-radius: 50%;
    background: var(--mist);
  }
  .status.open::before { background: var(--sun); }

  .question {
    margin: 0;
    max-width: 20ch;
    font-size: clamp(1.75rem, min(4.6cqw, 8.5cqh), 4.75rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .question.placeholder { font-weight: 400; opacity: 0.75; }
  /* Questions are asked out loud, so the big screen shows only the secret count */
  #question { display: none; }

  .result {
    margin: auto 0;               /* centers vertically in the space left under the question */
    padding-top: 2cqh;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .yes-line {
    display: flex; align-items: baseline; justify-content: center; gap: 0.12em;
    /* Sized by fitYes() in the script: as big as fits above the panel */
    font-size: var(--yes-size, clamp(4rem, min(20cqw, 34cqh), 19rem));
  }
  .yes-count {
    display: inline-flex;
    height: 1em;
    color: var(--sun);
    font-size: 1em;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
    transform-origin: center bottom;
  }
  .yes-count.secret { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.55; } }
  .yes-count.bump { animation: bump 0.45s ease-out; }
  @keyframes bump { from { transform: scale(1.12); } to { transform: scale(1); } }
  .yes-label { font-size: 0.32em; font-weight: 800; white-space: nowrap; }

  /* slot-machine wheels for the reveal */
  .wheel { display: inline-block; height: 1em; overflow: hidden; }
  .strip {
    display: flex; flex-direction: column;
    transition-property: transform;
    transition-timing-function: cubic-bezier(0.12, 0.75, 0.18, 1);
  }
  .strip span { height: 1em; display: block; text-align: center; }

  .reveal-extra[hidden] { display: none; }
  .reveal-extra { width: 100%; animation: fadeIn 0.6s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } }

  .bar {
    max-width: 900px; height: 14px; margin: 2.5cqh auto 0;
    background: var(--mist); border-radius: 7px; overflow: hidden;
  }
  .bar span {
    display: block; height: 100%; width: 0;
    background: var(--sun);
    transition: width 0.5s ease;
  }
  .tally { margin: 1rem 0 0; font-size: 1.5rem; opacity: 0.85; }
  .tally b { font-weight: 600; margin-right: 1.5em; }

  .hidden-note { margin: 2.5cqh 0 0; font-size: clamp(1.1rem, min(2.6cqw, 5cqh), 2.25rem); font-weight: 600; }
  .hidden-note[hidden] { display: none; }

  .join {
    align-self: start;
    width: min(280px, 30cqw, 62cqh);
    padding: 1.25rem;
    background: var(--paper); color: var(--ink);
    border-radius: 20px;
    text-align: center;
  }
  .qr img, .qr canvas { width: 100%; height: auto; }
  .join-text { margin: 0.75rem 0 0.25rem; font-size: 1.5rem; font-weight: 800; }
  .join-url { margin: 0; font-size: 0.85rem; word-break: break-all; opacity: 0.75; }

  /* Host buttons: a small cluster in the bottom-right corner. H hides them. */
  .controls {
    position: fixed; right: 2.5vw; bottom: 3vh; z-index: 5;
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem;
  }
  .controls[hidden] { display: none; }
  .controls button {
    padding: 0.75rem 1.1rem;
    font: inherit; font-weight: 600; font-size: 1rem;
    border-radius: 10px; cursor: pointer;
    border: 2px solid var(--sun);
    background: var(--sun); color: var(--ink);
  }
  .controls button.ghost { background: transparent; color: var(--paper); border-color: var(--mist); }
  .controls button:disabled { opacity: 0.4; cursor: default; }

  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

  .setup-error {
    position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem;
    background: var(--cobalt); text-align: center; font-size: 1.5rem; z-index: 10;
  }
  .setup-error[hidden] { display: none; }
  .setup-error p { max-width: 32ch; margin: 0 auto; }

  @media (max-width: 800px) {
    .stage { grid-template-columns: 1fr; overflow: auto; }
    .join { width: 220px; order: -1; }
    .controls { left: 2.5vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    .yes-count.bump, .yes-count.secret { animation: none; }
    .bar span { transition: none; }
  }

  /* ---------- Intro slides (shown before the game) ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background-color: #2438E8;
    opacity: 0; transition: opacity 0.5s ease, background-color 0.45s ease;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    font-family: "Fredoka", system-ui, sans-serif; font-weight: 400;
  }
  #intro[hidden] { display: none; }
  #intro, #intro *, #intro *::before, #intro *::after { box-sizing: border-box; }
  #intro.on { opacity: 1; }
  #intro.idle { cursor: none; }
  #intro .intro-stage {
    position: relative; overflow: hidden;
    width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9;
    container-type: inline-size;
  }
  #intro .sl { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 0.45s ease, visibility 0s 0.45s; }
  #intro .sl.on { opacity: 1; visibility: visible; transition: opacity 0.45s ease; }
  #intro .el { position: absolute; display: flex; flex-direction: column; }
  #intro .el img { display: block; width: 100%; height: auto; pointer-events: none; }
  #intro .el svg { width: 100%; height: 100%; }
  #intro .h { font-family: "Fredoka", system-ui, sans-serif; font-weight: 700; }
  #intro .blk { font-family: "Arial Black", "Archivo Black", system-ui, sans-serif; font-weight: 900; }
  #intro .rt { transform: rotate(var(--r, 0deg)); }

  /* Builds: an element is "hid" until its click comes */
  #intro .fx {
    transform: rotate(var(--r, 0deg));
    transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), clip-path 0.65s ease-out,
                backdrop-filter 1.1s ease-out, -webkit-backdrop-filter 1.1s ease-out;
  }
  #intro .fx.hid { opacity: 0; }
  #intro .fx.pop.hid { transform: rotate(var(--r, 0deg)) scale(0.35); }
  #intro .fx.wr, #intro .fx.wp { clip-path: inset(0 0 0 0); }
  #intro .fx.wr.hid { opacity: 1; clip-path: inset(0 100% 0 0); }      /* wipe in from the left */
  #intro .fx.wp.hid { opacity: 1; clip-path: inset(100% 0 0 0); }      /* wipe up from the bottom */
  #intro .fx.fly { transition: transform 0.75s cubic-bezier(0.2, 0.8, 0.2, 1); }
  #intro .fx.fly.hid { opacity: 1; transform: translateX(-56cqw); }   /* shirt flies in from the left */
  #intro .fx.mv { transform: translate(25cqw, -15cqw) scale(0.55); transition: transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
  #intro .fx.mv.hid { opacity: 1; transform: none; }                  /* teaser glides to the top right */
  #intro .fx.ub { -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); }
  #intro .fx.ub.hid { opacity: 1; -webkit-backdrop-filter: blur(0.45cqw); backdrop-filter: blur(0.45cqw); }  /* name blurred until its click */

  #intro .intro-ripple {
    position: absolute; left: 50%; top: 50%; width: 0.44cqw; height: 0.44cqw; padding: 2.2cqw; border-radius: 50%;
    background: #0E1A6B; pointer-events: none; animation: intro-ripple 0.55s ease-out forwards;
  }
  @keyframes intro-ripple { from { transform: translate(-50%, -50%) scale(0.2); opacity: 0.6; } to { transform: translate(-50%, -50%) scale(2.4); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #intro, #intro .sl, #intro .fx { transition: none; }
    #intro .intro-ripple { display: none; }
  }
</style>
</head>
<body class="with-controls">

<!-- Intro slides: they play first, then the clicker hands over to the game. -->
<div id="intro" class="on" role="region" aria-roledescription="slideshow" aria-label="Intro slides">
  <div class="intro-stage"></div>
</div>
<script>
/* ==========================================================================
   Intro slides, shown full screen before the game.
   Clicker / keys while the intro is showing:
     next: → ↓ PageDown Space Enter N or a mouse click   back: ← ↑ PageUp B
     skip straight to the game: Esc or G
   In the game, press ← / PageUp (or the clicker's back button) to return to the last slide,
   or I to play the intro again from the start. The vote on screen keeps running underneath.
   Add ?intro=off to the page address to open straight into the game.
   ========================================================================== */
(() => {
  const root = document.getElementById("intro");
  if (!root) return;

  /* ---- Words on the slides: edit here ---------------------------------- */
  const WORDS = {
    q1: "Can we find a question that", q2: "only one person", q3: "in this room says Yes to?",
    goal: "The goal: exactly 1",
    cards: [["0", "Nobody?<br>Too specific."], ["1", "Bingo!<br>Just one of you."], ["14", "Way too many.<br>Try again."]],
    how: "How it goes",
    steps: ["Someone asks", "You vote", "Shh, it\u2019s secret", "The reveal"],
    sampleQ: "Ever eaten a bug?",
    rulesTitle: "Just 3 rules",
    rules: [["Ask,<br>don\u2019t vote", "No voting on your own question!"],
            ["Yes or No only", "No maybes allowed."],
            ["Be honest", "The game only works if you tell the truth."]],
    teaser: ["If you get", "1 Yes...?"],
    original: "The original!",
    ideasTitle: "Need a question? Try these",
    ideas: [["lab", "Ever fought with your PI?"], ["jp", "Ever seen snow monkeys in a hot spring?"],
            ["us", "Ever driven all of Route&nbsp;66?"], ["both", "Ever tried to tip someone in Japan?"],
            ["us", "Ever spotted a bear in a national park?"], ["both", "Ever seen sumo AND an NFL game live?"]],
    ideasSticker: "Or make your own!",
  };
  /* ----------------------------------------------------------------------- */

  const SHIRT = root.dataset.shirt || "intro-shirt.jpg";
  const PHOTO = root.dataset.photo || "intro-photo.jpg";
  const IN = (v) => v * 10 + "cqw";                    // slide is 10 in wide, so 1 in = 10cqw
  const PT = (p) => (p * 100 / 720).toFixed(3) + "cqw"; // 720 pt across the slide
  const K = { cob: "#2438E8", yel: "#FFD23F", navy: "#0E1A6B", off: "#F6F7FB", peri: "#C9D0FF", lav: "#8C97E8", ink: "#3A4590", w: "#FFFFFF" };
  const ICON = {"TbHandStop": "<svg aria-hidden=\"true\" stroke=\"currentColor\" fill=\"none\" stroke-width=\"2\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M8 13v-7.5a1.5 1.5 0 0 1 3 0v6.5\"></path><path d=\"M11 5.5v-2a1.5 1.5 0 1 1 3 0v8.5\"></path><path d=\"M14 5.5a1.5 1.5 0 0 1 3 0v6.5\"></path><path d=\"M17 7.5a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47\"></path></svg>", "TbHeartHandshake": "<svg aria-hidden=\"true\" stroke=\"currentColor\" fill=\"none\" stroke-width=\"2\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572\"></path><path d=\"M12 6l-3.293 3.293a1 1 0 0 0 0 1.414l.543 .543c.69 .69 1.81 .69 2.5 0l1 -1a3.182 3.182 0 0 1 4.5 0l2.25 2.25\"></path><path d=\"M12.5 15.5l2 2\"></path><path d=\"M15 13l2 2\"></path></svg>", "TbSquareCheck": "<svg aria-hidden=\"true\" stroke=\"currentColor\" fill=\"none\" stroke-width=\"2\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M3 3m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z\"></path><path d=\"M9 12l2 2l4 -4\"></path></svg>", "TbEyeOff": "<svg aria-hidden=\"true\" stroke=\"currentColor\" fill=\"none\" stroke-width=\"2\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M10.585 10.587a2 2 0 0 0 2.829 2.828\"></path><path d=\"M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87\"></path><path d=\"M3 3l18 18\"></path></svg>", "TbCheck": "<svg aria-hidden=\"true\" stroke=\"currentColor\" fill=\"none\" stroke-width=\"2\" viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M5 12l5 5l10 -10\"></path></svg>"};
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = root.querySelector(".intro-stage");
  const slides = [], hooks = [];
  let cur, timers = [];

  function el(x, y, w, h, o = {}) {
    const d = document.createElement("div");
    d.className = "el" + (o.h ? " h" : "") + (o.blk ? " blk" : "");
    d.style.cssText = `left:${IN(x)};top:${IN(y)};width:${IN(w)};height:${IN(h)};`;
    if (o.t != null) {
      d.innerHTML = o.t;
      d.style.fontSize = PT(o.s || 18);
      d.style.color = o.c || K.navy;
      d.style.justifyContent = { top: "flex-start", mid: "center", bot: "flex-end" }[o.v || "top"];
      d.style.textAlign = o.a || "left";
      if (o.a === "center") d.style.alignItems = "center";
      d.style.lineHeight = o.lh || (o.h ? 1.12 : 1.25);
    }
    if (o.bg) d.style.background = o.bg;
    if (o.r != null) d.style.borderRadius = IN(o.r);
    if (o.rot) { d.style.setProperty("--r", o.rot + "deg"); if (o.b == null) d.classList.add("rt"); }
    if (o.css) d.style.cssText += o.css;
    if (o.b != null) { d.dataset.b = o.b; d.dataset.d = o.d || 0; d.classList.add("fx", ...(o.fx || "").split(" ").filter(Boolean)); }
    cur.appendChild(d);
    return d;
  }
  const line = (w) => `border:${IN(w)} solid ${K.navy};`;
  const title = (t, dark) => el(0.6, 0.4, 8.8, 0.8, { t, s: 36, h: 1, c: dark ? K.w : K.navy, v: "mid" });
  const sticker = (t, x, y, w, h, rot, s, b, d) => el(x, y, w, h, { t, s, h: 1, a: "center", v: "mid", bg: K.yel, r: 0.25, rot, b, d, fx: "pop" });
  function slide(name, bg, build, hook) {
    cur = document.createElement("section");
    cur.className = "sl"; cur.dataset.bg = bg; cur.setAttribute("aria-label", name);
    build(); stage.appendChild(cur); slides.push(cur); hooks.push(hook || null);
  }
  const T = (f, ms) => timers.push(setTimeout(f, ms));

  /* 1. The question */
  slide("The question", K.cob, () => {
    el(0.6, 0.7, 8.8, 0.8, { t: WORDS.q1, s: 36, h: 1, c: K.w, a: "center", v: "bot" });
    el(0.8, 1.95, 8.4, 1.55, { t: WORDS.q2, s: 60, blk: 1, c: K.navy, a: "center", v: "mid", lh: 1, bg: K.yel, r: 0.2, rot: -3, b: 0, d: 400, fx: "wr" });
    el(0.6, 4.0, 8.8, 0.8, { t: WORDS.q3, s: 36, h: 1, c: K.w, a: "center" });
  });

  /* 2. The goal: exactly 1 */
  slide("The goal", K.cob, () => {
    title(WORDS.goal, true);
    const ow = (8.8 - 0.6) / 3, order = [1, 3, 2];
    WORDS.cards.forEach(([n, verdict], i) => {
      const hero = i === 1, main = hero ? K.navy : K.peri;
      el(0.6 + i * (ow + 0.3), 1.4, ow, 3.5, {
        bg: hero ? K.yel : K.navy, r: 0.22, b: order[i], fx: hero ? "wp" : "", s: 20, css: `padding:${IN(0.25)};`,
        t: `<div class="h" style="font-size:${PT(88)};line-height:1;color:${main}">${n}</div>` +
           `<div class="h" style="font-size:${PT(26)};font-weight:400;color:${hero ? K.navy : K.w};margin-top:${IN(0.08)}">said yes</div>` +
           `<div style="font-size:${PT(20)};color:${main};margin-top:${IN(0.18)};line-height:1.3;${hero ? "font-weight:700" : ""}">${verdict}</div>`,
      });
    });
  });

  /* 3. How it goes (comic strip) */
  let yesBtn, reel;
  slide("How it goes", K.off, () => {
    title(WORDS.how);
    const pw = 2.05, py = 1.51, ph = 2.45, X = (i) => 0.6 + i * 2.25, tilt = [-8, 6, -5, 7];
    WORDS.steps.forEach((c, i) => {
      const b = i + 1;
      el(X(i), py, pw, ph, { bg: K.w, r: 0.22, css: line(0.035), b, fx: "pop" });
      el(X(i) - 0.15, py - 0.18, 0.5, 0.5, { t: String(b), s: 20, h: 1, a: "center", v: "mid", bg: K.yel, rot: tilt[i], css: "border-radius:50%;" + line(0.028), b, fx: "pop" });
      el(X(i) - 0.1, py + ph + 0.12, pw + 0.2, 0.7, { t: c, s: 20, h: 1, a: "center", b, fx: "pop" });
    });
    let x = X(0);
    el(x + 0.45, py + 1.6, 1.15, 0.8, { bg: K.cob, css: line(0.05) + `border-bottom:none;border-radius:${IN(0.36)} ${IN(0.36)} 0 0;`, b: 1, d: 400, fx: "pop" });   // body
    el(x + 0.69, py + 0.93, 0.67, 0.67, { bg: K.off, css: line(0.05) + "border-radius:50%;", b: 1, d: 400, fx: "pop" });                                  // head
    el(x + 0.86, py + 1.15, 0.08, 0.08, { bg: K.navy, css: "border-radius:50%;", b: 1, d: 400, fx: "pop" });                                            // eyes
    el(x + 1.11, py + 1.15, 0.08, 0.08, { bg: K.navy, css: "border-radius:50%;", b: 1, d: 400, fx: "pop" });
    el(x + 0.945, py + 1.33, 0.16, 0.13, { bg: K.navy, css: "border-radius:50%;", b: 1, d: 400, fx: "pop" });                                          // talking mouth
    el(x + 0.9, py + 0.66, 0.24, 0.18, { css: `width:0;height:0;border-left:${IN(0.12)} solid transparent;border-right:${IN(0.12)} solid transparent;border-top:${IN(0.18)} solid ${K.yel};`, b: 1, d: 750, fx: "pop" });
    el(x + 0.08, py + 0.13, 1.89, 0.58, { bg: K.yel, r: 0.2, t: WORDS.sampleQ, s: 14, h: 1, a: "center", v: "mid", rot: -3, b: 1, d: 750, fx: "pop" });
    x = X(1);
    el(x + 0.55, py + 0.55, 0.95, 1.7, { r: 0.15, bg: K.off, css: line(0.05), b: 2, d: 400, fx: "pop" });
    el(x + 0.87, py + 0.65, 0.3, 0.06, { bg: K.navy, r: 0.03, b: 2, d: 400, fx: "pop" });
    yesBtn = el(x + 0.67, py + 0.8, 0.71, 0.55, { bg: K.yel, r: 0.08, t: "Yes", s: 15, h: 1, a: "center", v: "mid", css: "overflow:hidden;", b: 2, d: 400, fx: "pop" });
    el(x + 0.67, py + 1.5, 0.71, 0.55, { bg: K.cob, r: 0.08, t: "No", s: 15, h: 1, c: K.w, a: "center", v: "mid", b: 2, d: 400, fx: "pop" });
    el(x + 1.22, py + 0.17, 0.75, 0.4, { t: "tap!", s: 16, h: 1, c: K.cob, a: "center", v: "mid", rot: 12, b: 2, d: 1050, fx: "pop" });
    el(x + 1.22, py + 0.66, 0.3, 0.3, { bg: K.navy, css: `border-radius:50%;align-items:center;justify-content:center;color:#fff;padding:${IN(0.05)};`, t: ICON.TbCheck, b: 2, d: 1350, fx: "pop" });
    const screen = (xx, b) => {
      el(xx + 0.15, py + 0.35, 1.75, 1.15, { bg: K.cob, r: 0.1, b, d: 400, fx: "pop" });
      el(xx + 0.92, py + 1.5, 0.2, 0.24, { bg: K.navy, b, d: 400, fx: "pop" });
      el(xx + 0.72, py + 1.72, 0.6, 0.08, { bg: K.navy, r: 0.04, b, d: 400, fx: "pop" });
    };
    x = X(2); screen(x, 3);
    el(x + 0.22, py + 0.38, 0.75, 1.08, { t: "?", s: 54, h: 1, c: K.yel, a: "center", v: "mid", lh: 1, b: 3, d: 400, fx: "pop" });
    el(x + 1.0, py + 0.6, 0.85, 0.6, { t: "162<br>votes in", s: 13, c: K.peri, v: "mid", lh: 1.05, b: 3, d: 400, fx: "pop" });
    el(x + 0.55, py + 1.88, 1.1, 0.45, { t: "Shh!", s: 18, h: 1, a: "center", v: "mid", bg: K.yel, r: 0.22, rot: -6, css: line(0.028), b: 3, d: 1000, fx: "pop" });
    x = X(3); screen(x, 4);
    reel = el(x + 0.15, py + 0.35, 1.75, 1.15, { t: "?", s: 60, h: 1, c: K.yel, a: "center", v: "mid", lh: 1, b: 4, d: 400, fx: "pop" });
    [[0.15, 0.12, K.yel], [0.55, 0.05, K.cob], [1.35, 0.1, K.lav], [1.75, 0.2, K.yel], [0.3, 1.55, K.lav], [1.6, 1.6, K.cob], [1.05, 0.02, K.yel]]
      .forEach(([dx, dy, col], k) => el(x + dx, py + dy, 0.14, 0.14, { bg: col, r: 0.03, rot: k * 25, b: 4, d: 1850 + k * 40, fx: "pop" }));
    el(x + 0.5, py + 1.88, 1.1, 0.45, { t: "Bingo!", s: 18, h: 1, a: "center", v: "mid", bg: K.yel, r: 0.22, rot: 5, css: line(0.028), b: 4, d: 1950, fx: "pop" });
  }, {
    state: (bi) => { reel.textContent = bi >= 4 ? "1" : "?"; },
    animate: (bi) => {
      if (bi === 2) T(() => {
        const r = document.createElement("span");
        r.className = "intro-ripple";
        yesBtn.appendChild(r);
        setTimeout(() => r.remove(), 650);
      }, 1050);
      if (bi === 4) {
        reel.textContent = "?";
        let t = 1250;
        ["48", "7", "23", "1"].forEach((n, k) => {
          T(() => { reel.textContent = n; if (n === "1") reel.animate([{ transform: "scale(.4)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 380 }); }, t);
          t += k < 2 ? 140 : 170;
        });
      }
    },
  });

  /* 4. Just 3 rules */
  slide("Just 3 rules", K.off, () => {
    title(WORDS.rulesTitle);
    const rw = (8.8 - 0.5) / 3, rh = 3.45, ry = 1.35, pad = 0.25, icons = ["TbHandStop", "TbSquareCheck", "TbHeartHandshake"];
    WORDS.rules.forEach(([head, text], i) => {
      const x = 0.6 + i * (rw + 0.25), b = i + 1;
      el(x, ry, rw, rh, { bg: K.w, r: 0.22, b });
      el(x + pad, ry + 0.3, 0.8, 0.8, { bg: K.yel, css: `border-radius:50%;align-items:center;justify-content:center;color:${K.navy};padding:${IN(0.18)};`, t: ICON[icons[i]], b });
      el(x + pad, ry + 1.25, rw - 2 * pad, 0.85, { t: head, s: 24, h: 1, b });
      el(x + pad, ry + 2.1, rw - 2 * pad, 1.2, { t: text, s: 18, c: K.ink, b });
    });
  });

  /* 5. The prize */
  slide("The prize", K.cob, () => {
    el(0.6, 0.64, 4.85, 4.35, { r: 0.15, css: "overflow:hidden;", t: `<img src="${SHIRT}" alt="Prize T-shirt printed with a vintage beach fishing photo and a name" draggable="false">`, b: 1, fx: "fly" });
    el(2.45, 2.77, 1.0, 0.28, { r: 0.08, b: 2, fx: "ub" });   // frosted patch over the printed name
    el(2.0, 1.8, 6.0, 2.0, { t: `${WORDS.teaser[0]}<br><span style="color:${K.yel}">${WORDS.teaser[1]}</span>`, s: 60, h: 1, c: K.w, a: "center", v: "mid", lh: 1, b: 1, fx: "mv" });
    el(7.55 - 1.565, 3.72 - 1.235, 3.13, 2.47, { bg: K.w, rot: 4, css: `padding:${IN(0.1)} ${IN(0.1)} ${IN(0.25)};box-shadow:0 ${IN(0.06)} ${IN(0.2)} rgba(5,10,60,.45);`, t: `<img src="${PHOTO}" alt="The original vintage photo the shirt print came from" draggable="false">`, b: 3, fx: "pop" });
    sticker(WORDS.original, 7.3, 2.17, 2.35, 0.52, 8, 20, 3, 600);
  });

  /* 6. Need a question? Try these (plays by itself) */
  slide("Example questions", K.off, () => {
    title(WORDS.ideasTitle);
    const tags = { lab: ["Lab life", K.navy, K.w, 1.15], jp: ["Japan", K.yel, K.navy, 0.95], us: ["USA", K.cob, K.w, 0.8], both: ["US + Japan", K.lav, K.navy, 1.45] };
    const cw = (8.8 - 0.3) / 2, ch = 1.05, tilt = [-3, 4, -2, 3, -4, 2];
    let d = 300;
    WORDS.ideas.forEach(([tag, q], i) => {
      const x = 0.6 + (i % 2) * (cw + 0.3), y = 1.4 + Math.floor(i / 2) * (ch + 0.22), t = tags[tag];
      el(x, y, cw, ch, { bg: K.w, r: 0.22, css: line(0.035), b: 0, d, fx: "pop" });
      el(x + 0.25, y + 0.22, cw - 0.5, 0.7, { t: q, s: 18, h: 1, b: 0, d, fx: "pop" });
      el(x + cw - t[3] - 0.2, y - 0.17, t[3], 0.36, { t: t[0], s: 14, h: 1, c: t[2], a: "center", v: "mid", bg: t[1], r: 0.18, rot: tilt[i], css: line(0.02), b: 0, d, fx: "pop" });
      d += 470;
    });
    sticker(WORDS.ideasSticker, 6.2, 4.78, 3.25, 0.55, -4, 20, 0, d + 250);
  });

  /* ---- Playback ---------------------------------------------------------- */
  let active = false, si = 0, bi = 0, quietUntil = 0;
  const maxB = (i) => Math.max(0, ...[...slides[i].querySelectorAll("[data-b]")].map((e) => +e.dataset.b));
  const clearT = () => { timers.forEach(clearTimeout); timers = []; };
  function hideAll(i) {
    const xs = slides[i].querySelectorAll("[data-b]");
    xs.forEach((e) => { e.style.transition = "none"; e.style.transitionDelay = ""; e.classList.add("hid"); });
    void stage.offsetWidth;
    xs.forEach((e) => (e.style.transition = ""));
  }
  function show(anim) {
    slides.forEach((s, k) => s.classList.toggle("on", k === si));
    root.style.backgroundColor = slides[si].dataset.bg;
    const hk = hooks[si];
    if (hk?.state) hk.state(bi);
    const xs = slides[si].querySelectorAll("[data-b]");
    xs.forEach((e) => {
      const vis = +e.dataset.b <= bi, hidden = e.classList.contains("hid");
      if (vis && hidden) {
        if (anim && !reduce) e.style.transitionDelay = e.dataset.d + "ms"; else e.style.transition = "none";
        e.classList.remove("hid");
      } else if (!vis && !hidden) {
        e.style.transition = "none"; e.style.transitionDelay = ""; e.classList.add("hid");
      }
    });
    void stage.offsetWidth;
    xs.forEach((e) => { if (e.style.transition === "none") e.style.transition = ""; });
    if (anim && !reduce && hk?.animate) hk.animate(bi);
  }
  function enter(i, built) { clearT(); si = i; hideAll(i); bi = built ? maxB(i) : 0; show(!built); }
  function next() {
    clearT();
    if (bi < maxB(si)) { bi++; show(true); }
    else if (si < slides.length - 1) enter(si + 1, false);
    else close();
  }
  function back() {
    clearT();
    if (bi > 0) { bi--; show(false); }
    else if (si > 0) enter(si - 1, true);
  }
  function open(at = 0, built = false) {
    active = true;
    root.hidden = false;
    document.activeElement?.blur?.();
    enter(at, built);
    requestAnimationFrame(() => root.classList.add("on"));
  }
  function close() {
    active = false;
    quietUntil = performance.now() + 900;   // swallow a double-press on the last slide so it can't start voting by accident
    clearT();
    root.classList.remove("on");
    setTimeout(() => { if (!active) root.hidden = true; }, reduce ? 0 : 500);
  }

  const NEXT = ["ArrowRight", "ArrowDown", "PageDown", "Space", "Enter", "NumpadEnter", "KeyN"];
  const BACK = ["ArrowLeft", "ArrowUp", "PageUp", "KeyB", "Backspace"];
  const typing = () => ["TEXTAREA", "INPUT"].includes(document.activeElement?.tagName);
  // Capture phase on window runs before the game's own shortcuts, so the clicker
  // drives the slides while the intro is showing and the game afterwards.
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (!active) {
      if (performance.now() < quietUntil && NEXT.includes(e.code)) { e.preventDefault(); e.stopImmediatePropagation(); return; }
      if (e.repeat || typing()) return;
      if (e.code === "KeyI") { e.preventDefault(); e.stopImmediatePropagation(); open(); }
      // Back from the game: return to the last slide, fully shown, so you can step back through the explanation
      else if (BACK.includes(e.code)) { e.preventDefault(); e.stopImmediatePropagation(); open(slides.length - 1, true); }
      return;
    }
    e.stopImmediatePropagation();
    if (e.repeat) { e.preventDefault(); return; }
    if (NEXT.includes(e.code)) { e.preventDefault(); next(); }
    else if (BACK.includes(e.code)) { e.preventDefault(); back(); }
    else if (e.code === "Escape" || e.code === "KeyG") { e.preventDefault(); close(); }
  }, true);
  root.addEventListener("click", () => active && next());

  // Hide the mouse pointer on the projector after a moment of stillness
  let idle;
  root.addEventListener("mousemove", () => { root.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(() => root.classList.add("idle"), 1500); });

  if (new URLSearchParams(location.search).get("intro") === "off") root.hidden = true;
  else open();
})();
</script>

<main class="stage">
  <section id="poll">
    <p class="status" id="status">Waiting to start</p>
    <h1 class="question placeholder" id="question">Press “Start voting” to begin.</h1>

    <div class="result" id="result">
      <div class="yes-line">
        <span class="yes-count secret" id="yesCount" aria-live="polite">?</span>
        <span class="yes-label">said yes</span>
      </div>
      <p class="hidden-note" id="hiddenNote">0 votes in so far</p>
      <div class="reveal-extra" id="revealExtra" hidden>
        <div class="bar" aria-hidden="true"><span id="barYes"></span></div>
        <p class="tally"><b id="noCount">No: 0</b><span id="totalCount">0 votes</span></p>
      </div>
    </div>
  </section>

  <aside class="join">
    <div class="qr" id="qr"></div>
    <p class="join-text">Scan to vote</p>
    <p class="join-url" id="joinUrl"></p>
  </aside>
</main>

<div class="controls" id="controls" role="group" aria-label="Host controls"
     title="Shortcuts: N or → start voting · R reveal · H hide these buttons · ← back to the slides · I intro from the start">
  <button id="nextBtn">Start voting</button>
  <button id="openBtn" class="ghost" disabled>Close voting</button>
  <button id="resultsBtn" disabled>Reveal result</button>
</div>

<div class="setup-error" id="setupError" hidden>
  <p id="setupMsg">Add your Firebase settings to firebase.js to start. The README explains where to find them.</p>
</div>

<script type="module">
  import { db, signIn, isConfigured, ref, onValue, set, update } from "./firebase.js";

  const $ = (id) => document.getElementById(id);

  // QR code pointing at the audience page in the same folder
  const voteUrl = new URL("vote.html", location.href).href;
  new QRCode($("qr"), {
    text: voteUrl, width: 512, height: 512,
    colorDark: "#0E1A6B", colorLight: "#FFFFFF",
    correctLevel: QRCode.CorrectLevel.M,
  });
  $("joinUrl").textContent = voteUrl.replace(/^https?:\/\//, "");

  let session = null;
  let revealed = false;
  let rolling = false;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stopVotes = null;
  let nextIndex = 0;
  let counts = { yes: 0, no: 0 };

  function showError(msg) {
    $("setupMsg").textContent = msg;
    $("setupError").hidden = false;
  }

  if (!isConfigured) {
    $("setupError").hidden = false;
  } else {
    start();
  }

  async function start() {
    try {
      await signIn();
    } catch (e) {
      showError("Sign-in failed. In Firebase, turn on Authentication > Sign-in method > Anonymous, then reload. (" + e.code + ")");
      return;
    }
    onValue(ref(db, "session"), (snap) => {
      const prevId = session?.questionId;
      session = snap.val();
      renderSession();
      if (session?.questionId !== prevId) watchVotes(session?.questionId);
    }, (e) => showError("Can't read the database. Check the rules in the README. (" + e.message + ")"));
  }

  function watchVotes(questionId) {
    if (stopVotes) stopVotes();
    stopVotes = null;
    counts = { yes: 0, no: 0 };
    revealed = false;
    rolling = false;
    updateButtons();
    renderCounts(false);
    if (!questionId) return;
    stopVotes = onValue(ref(db, "votes/" + questionId), (snap) => {
      const next = { yes: 0, no: 0 };
      snap.forEach((child) => { if (child.val() === "yes") next.yes++; else next.no++; });
      const changed = next.yes !== counts.yes;
      counts = next;
      renderCounts(changed);
    });
  }

  // Make "### said yes" as large as possible while everything
  // (including the bar and tally shown after the reveal) stays above the panel.
  function fitYes() {
    if (rolling) return;
    const stage = document.querySelector(".stage");
    const poll = $("poll");
    const line = document.querySelector(".yes-line");
    const yesEl = $("yesCount");
    const extra = $("revealExtra");
    const note = $("hiddenNote");

    // Measure the worst case: widest likely number, bar and tally visible
    const saved = { text: yesEl.textContent, extra: extra.hidden, note: note.hidden };
    yesEl.textContent = "8".repeat(Math.max(3, String(counts.yes).length));
    extra.hidden = false;
    note.hidden = true;

    const cs = getComputedStyle(stage);
    const limit = stage.getBoundingClientRect().bottom - parseFloat(cs.paddingBottom);
    let size = Math.min(stage.clientHeight * 0.75, 560);
    const fits = () => {
      poll.style.setProperty("--yes-size", size + "px");
      return $("result").getBoundingClientRect().bottom <= limit + 0.5 && line.scrollWidth <= poll.clientWidth;
    };
    while (size > 56 && !fits()) size *= 0.95;

    yesEl.textContent = saved.text;
    extra.hidden = saved.extra;
    note.hidden = saved.note;
  }

  let fitTimer = null;
  const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitYes, 60); };
  addEventListener("resize", refit);
  document.fonts?.ready.then(fitYes);

  function renderSession() {
    const q = $("question");
    if (!session) {
      $("status").textContent = "Waiting to start";
      $("status").classList.remove("open");
      q.textContent = "Press “Start voting” to begin.";
      q.classList.add("placeholder");
      $("openBtn").disabled = true;
      updateButtons();
      return;
    }
    q.textContent = session.text;
    fitYes();
    q.classList.remove("placeholder");
    $("status").textContent = session.open ? "Voting open" : "Voting closed";
    $("status").classList.toggle("open", !!session.open);
    $("openBtn").disabled = false;
    $("openBtn").textContent = session.open ? "Close voting" : "Reopen voting";
    updateButtons();
  }

  function updateButtons() {
    const r = $("resultsBtn");
    const n = $("nextBtn");
    r.disabled = !session || rolling;
    r.textContent = revealed ? "Hide result" : "Reveal result";
    // Highlight whichever button is the natural next step
    r.classList.toggle("ghost", revealed);
    n.classList.toggle("ghost", !!session && !revealed);
  }

  function renderCounts(bump) {
    const { yes, no } = counts;
    const total = yes + no;
    const votes = total + (total === 1 ? " vote" : " votes");
    $("hiddenNote").textContent = votes + " in so far";
    $("barYes").style.width = total ? (yes / total) * 100 + "%" : "0";
    $("noCount").textContent = "No: " + no;
    $("totalCount").textContent = votes;
    if (rolling) return;

    const yesEl = $("yesCount");
    $("hiddenNote").hidden = revealed;
    $("revealExtra").hidden = !revealed;
    if (!revealed) {
      yesEl.textContent = "?";
      yesEl.classList.add("secret");
      return;
    }
    yesEl.classList.remove("secret");
    if (String(yes).length > 3 && String(yes).length !== yesEl.textContent.length) fitYes();
    if (yesEl.textContent !== String(yes)) {
      yesEl.textContent = yes;
      if (bump) pop(yesEl);
    }
  }

  function pop(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  // Slot-machine style reveal: each digit spins on its own wheel,
  // left digits stop first, the last digit spins longest.
  function rollTo(el, value, done) {
    const digits = String(value).split("");
    el.classList.remove("secret", "bump");
    el.textContent = "";
    const wheels = digits.map((d, i) => {
      const wheel = document.createElement("span");
      wheel.className = "wheel";
      const strip = document.createElement("span");
      strip.className = "strip";
      const steps = (4 + i * 2) * 10 + Number(d);
      for (let k = 0; k <= steps; k++) {
        const n = document.createElement("span");
        n.textContent = k % 10;
        strip.appendChild(n);
      }
      wheel.appendChild(strip);
      el.appendChild(wheel);
      return { strip, steps, ms: 2200 + i * 900 };
    });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      for (const w of wheels) {
        w.strip.style.transitionDuration = w.ms + "ms";
        w.strip.style.transform = "translateY(-" + w.steps + "em)";
      }
    }));
    const longest = Math.max(...wheels.map((w) => w.ms));
    setTimeout(() => {
      el.textContent = value;
      pop(el);
      done();
    }, longest + 100);
  }

  async function reveal() {
    if (!session || revealed || rolling) return;
    // Close voting so the number can't change after the big moment
    if (session.open) {
      try { await update(ref(db, "session"), { open: false }); } catch (e) {}
    }
    revealed = true;
    $("hiddenNote").hidden = true;
    if (reduceMotion) {
      renderCounts(false);
      updateButtons();
      return;
    }
    rolling = true;
    updateButtons();
    rollTo($("yesCount"), counts.yes, () => {
      rolling = false;
      updateButtons();
      renderCounts(false);
    });
  }

  function hideResult() {
    if (rolling) return;
    revealed = false;
    updateButtons();
    renderCounts(false);
  }

  function updateNextLabel() {
    $("nextBtn").textContent = "Start voting";
  }

  // Show the question at position `index` (0 = first) as a fresh vote
  let switching = false;
  async function showQuestion(index) {
    if (switching || index < 0) return;
    switching = true;
    try {
      await set(ref(db, "session"), {
        questionId: Date.now().toString(36),
        text: "What’s your answer?",   // shown on the phones above Yes / No
        open: true,
      });
      nextIndex = index + 1;
      updateNextLabel();
    } catch (e) {
      showError("Couldn't show the question. Check the database rules in the README. (" + e.message + ")");
    } finally {
      switching = false;
    }
  }

  $("nextBtn").addEventListener("click", () => showQuestion(nextIndex));

  $("openBtn").addEventListener("click", () => {
    if (session) update(ref(db, "session"), { open: !session.open });
  });

  $("resultsBtn").addEventListener("click", () => {
    if (revealed) hideResult(); else reveal();
  });

  // Keyboard shortcuts. Letters are matched by physical key (e.code),
  // so they work even when the keyboard is set to another language.
  const NEXT = ["KeyN", "ArrowRight", "PageDown"];
  const BACK = ["KeyB", "ArrowLeft", "PageUp"];
  const typing = () => ["TEXTAREA", "INPUT"].includes(document.activeElement?.tagName);

  document.addEventListener("keydown", (e) => {
    if (typing()) {
      // Esc leaves the questions box so the shortcuts work again
      if (e.key === "Escape") document.activeElement.blur();
      return;
    }
    if (e.repeat || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
    const code = e.code;
    if (NEXT.includes(code)) { e.preventDefault(); showQuestion(nextIndex); return; }
    if (BACK.includes(code)) { e.preventDefault(); return; }
    if (code === "KeyR") { reveal(); return; }
    if (code === "KeyH") {
      const c = $("controls");
      c.hidden = !c.hidden;
      fitYes();
      document.body.classList.toggle("with-controls", !c.hidden);
    }
  });

  // Clicking anywhere on the big screen also leaves the questions box
  document.querySelector(".stage").addEventListener("mousedown", () => {
    if (typing()) document.activeElement.blur();
  });


  updateNextLabel();
  fitYes();
</script>
</body>
</html>
